group 'co.epsilondelta.orion_flutter'
version '1.2.20'

buildscript {
    ext.kotlin_version = '1.8.22'
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.4.0'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
    }
}

rootProject.allprojects {
    repositories {
        google()
        mavenCentral()
        /*
        maven {
            name = "GitHubPackages"
            url = uri("https://maven.pkg.github.com/epsilondelta-speed/orion-flutter")
            credentials {
                username = project.findProperty("gpr.orionuser") ?: System.getenv("ORION_USERNAME")
                password = project.findProperty("gpr.orionkey") ?: System.getenv("ORION_GITHUB_TOKEN")
            }
        }*/
        maven { url "https://raw.githubusercontent.com/epsilondelta-speed/orion-flutter/main/maven" }
    }
}

apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'

android {
    namespace 'co.epsilondelta.orion_flutter'
    compileSdk 35

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    kotlinOptions {
        jvmTarget = '11'
    }

    defaultConfig {
        minSdkVersion 21
    }

    // ✅ Disable BuildConfig generation. The Orion Maven AAR already ships
    //    its own BuildConfig with ORION_SDK_VERSION. Without this, AGP
    //    generates an empty BuildConfig.class for this module too, causing
    //    "Duplicate class co.epsilondelta.orion_flutter.BuildConfig" on
    //    customer release builds. Added in 1.2.21 after BB hit this.
    buildFeatures {
        buildConfig false
    }
}

dependencies {
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk8:$kotlin_version"

    implementation('co.epsilondelta:orion-flutter:1.2.20') {
        exclude group: 'io.flutter', module: 'flutter_embedding_release'
    }

    // Runtime dependencies used by the AAR's compiled code.
    //
    // The published AAR is compile-only as far as transitive deps go (its POM
    // does not list runtime requirements), so this build.gradle is the
    // single source of truth for what the customer's app must have on its
    // runtime classpath. Without these, customers crash with
    // NoClassDefFoundError on first beacon attempt (1.2.16 regression).
    //
    // Versions are conservative — most modern Flutter apps already use
    // higher versions, and Gradle resolves to the higher of two declarations.
    implementation "com.squareup.okhttp3:okhttp:4.12.0"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.6.4"
    implementation "androidx.annotation:annotation:1.6.0"
    implementation "androidx.core:core-ktx:1.10.1"
    implementation "androidx.fragment:fragment-ktx:1.6.0"
}
